[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinelabs-online-p3p-server-sdk"
version = "0.1.4"
description = "Pine Labs Online P3P Server SDK — x402 Pine Labs Online P3P server middleware (Python)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pine Labs Online" }]
keywords = ["mpp", "x402", "payment", "server", "upi", "sbmd", "machine-payments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
flask = ["flask>=2.3"]
fastapi = ["fastapi>=0.110", "starlette>=0.36"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "flask>=2.3", "fastapi>=0.110"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pinelabs_p3p_server = ["py.typed"]
